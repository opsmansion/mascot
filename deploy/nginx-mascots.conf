# Nginx site for Opesi Mansion Mascots. Copy to /etc/nginx/sites-available/mascots.opesimansion.com,
# enable it, then run: sudo certbot --nginx -d mascots.opesimansion.com  (Certbot adds the HTTPS server block).
# The port must match MASCOTS_PORT in .env.
server {
    listen 80;
    listen [::]:80;
    server_name mascots.opesimansion.com;

    # Pass the visitor's own address, replacing any value the visitor sent, so per-visitor limits work.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:3300;
        # A full icon set takes about a second to draw; leave room for a queue.
        proxy_read_timeout 60s;
    }
}
